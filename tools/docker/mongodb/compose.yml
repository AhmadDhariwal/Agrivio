name: agrivio-mongodb

services:
  mongodb:
    image: mongo:8.2.12
    container_name: agrivio-mongodb-rs0
    ports:
      - '127.0.0.1:27017:27017'
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - agrivio_mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

volumes:
  agrivio_mongodb_data:
