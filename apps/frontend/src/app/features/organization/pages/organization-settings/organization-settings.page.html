<agrivio-ui-page-header
  title="Organization settings"
  eyebrow="Setup"
  lede="Manage residual operational settings for this organization. Specialized policies stay with their owning modules."
/>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading settings…" />
} @else if (permissionDenied()) {
  <agrivio-ui-alert tone="warning" message="You do not have permission to view organization settings." />
} @else {
  @if (errorMessage(); as error) {
    <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
  }
  @if (successMessage(); as success) {
    <agrivio-ui-alert tone="success" [message]="success" />
  }

  <section class="ag-stack" data-testid="organization-settings">
    <form
      class="ag-card ag-stack ag-form ag-form--with-required-hint"
      [formGroup]="profileForm"
      (ngSubmit)="saveProfile()"
    >
      <h2>Organization profile</h2>
      <div class="ag-field">
        <agrivio-ui-field-label
          label="Legal name"
          for="org-profile-name"
          [required]="fieldRequired(profileForm.controls.name)"
        />
        <input
          id="org-profile-name"
          class="ag-input"
          formControlName="name"
          data-testid="org-profile-name"
          [attr.aria-required]="fieldRequired(profileForm.controls.name) ? 'true' : null"
        />
      </div>
      <div class="ag-field">
        <agrivio-ui-field-label
          label="Business timezone (IANA)"
          for="org-profile-timezone"
          [required]="fieldRequired(profileForm.controls.timezone)"
        />
        <input
          id="org-profile-timezone"
          class="ag-input"
          formControlName="timezone"
          data-testid="org-profile-timezone"
          [attr.aria-required]="fieldRequired(profileForm.controls.timezone) ? 'true' : null"
        />
      </div>
      @if (canUpdateOrg()) {
        <button class="ag-btn" type="submit" [disabled]="saving()">Save profile</button>
      }
    </form>

    <form
      class="ag-card ag-stack ag-form ag-form--with-required-hint"
      [formGroup]="settingsForm"
      (ngSubmit)="saveSettings()"
    >
      <h2>Residual settings</h2>
      <div class="ag-field">
        <agrivio-ui-field-label label="Trading name" for="settings-trading-name" />
        <input
          id="settings-trading-name"
          class="ag-input"
          formControlName="tradingName"
          data-testid="settings-trading-name"
        />
      </div>
      <div class="ag-field">
        <agrivio-ui-field-label label="Contact phone" for="settings-contact-phone" />
        <input
          id="settings-contact-phone"
          class="ag-input"
          formControlName="contactPhone"
          data-testid="settings-contact-phone"
        />
      </div>
      <div class="ag-field">
        <agrivio-ui-field-label label="Contact email" for="settings-contact-email" />
        <input
          id="settings-contact-email"
          class="ag-input"
          formControlName="contactEmail"
          data-testid="settings-contact-email"
        />
      </div>
      <div class="ag-field">
        <agrivio-ui-field-label label="Address" for="settings-address" />
        <input
          id="settings-address"
          class="ag-input"
          formControlName="addressLine"
          data-testid="settings-address"
        />
      </div>
      <div class="ag-field">
        <agrivio-ui-field-label label="Document footer note" for="settings-footer" />
        <textarea
          id="settings-footer"
          class="ag-input"
          formControlName="documentFooterNote"
          rows="3"
          data-testid="settings-footer"
        ></textarea>
      </div>
      @if (canManage()) {
        <button class="ag-btn" type="submit" [disabled]="saving()" data-testid="settings-save">
          Save settings
        </button>
      } @else {
        <agrivio-ui-alert tone="info" message="You can view settings but cannot change them." />
      }
    </form>
  </section>
}
