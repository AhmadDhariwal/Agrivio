<agrivio-ui-page-header
  title="Opening stock"
  eyebrow="Inventory"
  lede="Post auditable opening stock with batch and expiry when product tracking requires them."
/>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading opening stock form…" />
} @else if (!canPost()) {
  <agrivio-ui-alert
    tone="warning"
    message="You do not have permission to post opening stock."
  />
} @else {
  @if (errorMessage(); as error) {
    <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
  }
  @if (successMessage(); as success) {
    <agrivio-ui-alert tone="success" [message]="success" data-testid="opening-stock-success" />
  }

  <form
    class="ag-stack form ag-form ag-form--with-required-hint"
    [formGroup]="form"
    (ngSubmit)="submit()"
    data-testid="opening-stock-form"
  >
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Warehouse"
        for="opening-warehouse"
        [required]="fieldRequired(form.controls.warehouseId)"
      />
      <select
        id="opening-warehouse"
        class="ag-select"
        formControlName="warehouseId"
        data-testid="opening-warehouse"
        [attr.aria-required]="fieldRequired(form.controls.warehouseId) ? 'true' : null"
      >
        <option value="">Select warehouse</option>
        @for (warehouse of warehouses(); track warehouse.id) {
          <option [value]="warehouse.id">{{ warehouse.name }}</option>
        }
      </select>
    </div>

    <div class="ag-field">
      <agrivio-ui-field-label
        label="Product"
        for="opening-product"
        [required]="fieldRequired(form.controls.productId)"
      />
      <select
        id="opening-product"
        class="ag-select"
        formControlName="productId"
        data-testid="opening-product"
        [attr.aria-required]="fieldRequired(form.controls.productId) ? 'true' : null"
      >
        <option value="">Select product</option>
        @for (product of products(); track product.id) {
          <option [value]="product.id">
            {{ product.name }} ({{ product.trackingMode }})
          </option>
        }
      </select>
    </div>

    <div class="ag-field">
      <agrivio-ui-field-label
        label="Quantity"
        for="opening-quantity"
        [required]="fieldRequired(form.controls.quantity)"
      />
      <input
        id="opening-quantity"
        class="ag-input"
        formControlName="quantity"
        data-testid="opening-quantity"
        [attr.aria-required]="fieldRequired(form.controls.quantity) ? 'true' : null"
      />
    </div>

    <div class="ag-field">
      <agrivio-ui-field-label label="Packaging unit (optional — blank uses base unit)" for="opening-packaging" />
      <select id="opening-packaging" class="ag-select" formControlName="packagingUnitId" data-testid="opening-packaging">
        <option value="">Base unit</option>
        @for (unit of packagingUnits(); track unit.id) {
          <option [value]="unit.id">
            {{ unit.name }} (×{{ unit.conversionFactor }})
          </option>
        }
      </select>
    </div>

    @if (selectedTrackingMode() !== 'none') {
      <div class="ag-field">
        <agrivio-ui-field-label label="Batch number" for="opening-batch-number" />
        <input id="opening-batch-number" class="ag-input" formControlName="batchNumber" data-testid="opening-batch-number" />
      </div>
      <div class="ag-field">
        <agrivio-ui-field-label label="Manufacturing date (optional)" for="opening-manufacturing-date" />
        <input
          id="opening-manufacturing-date"
          class="ag-input"
          type="date"
          formControlName="manufacturingDate"
          data-testid="opening-manufacturing-date"
        />
      </div>
    }

    @if (selectedTrackingMode() === 'batch_expiry') {
      <div class="ag-field">
        <agrivio-ui-field-label label="Expiry date" for="opening-expiry-date" />
        <input id="opening-expiry-date" class="ag-input" type="date" formControlName="expiryDate" data-testid="opening-expiry-date" />
      </div>
    }

    <div class="ag-field">
      <agrivio-ui-field-label
        label="Opening inventory value (PKR)"
        for="opening-inventory-value"
        [required]="fieldRequired(form.controls.inventoryValue)"
      />
      <input
        id="opening-inventory-value"
        class="ag-input"
        formControlName="inventoryValue"
        data-testid="opening-inventory-value"
        [attr.aria-required]="fieldRequired(form.controls.inventoryValue) ? 'true' : null"
      />
    </div>

    <div class="ag-inline">
      <button
        class="ag-btn"
        type="submit"
        [disabled]="saving()"
        data-testid="opening-stock-save"
      >
        {{ saving() ? 'Posting…' : 'Post opening stock' }}
      </button>
      <a class="ag-btn ag-btn--secondary" routerLink="/app/inventory/stock">View stock</a>
    </div>
  </form>
}
