<agrivio-ui-page-header
  title="Branches"
  eyebrow="Locations"
  lede="Create and manage branches, including invoice prefixes used for branch-wise numbering."
>
  @if (canManage()) {
    <a class="ag-btn" routerLink="/app/branches/new" data-testid="branch-create-link">Create branch</a>
  }
</agrivio-ui-page-header>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading branches…" />
} @else if (errorMessage(); as error) {
  <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
} @else if (items().length === 0) {
  <agrivio-ui-empty-state
    title="No branches yet"
    message="Create the first branch to configure invoice prefixes and operational locations."
  />
} @else {
  <div class="ag-stack" data-testid="branches-list">
    @for (item of items(); track item.id) {
      <article class="branch-row">
        <div>
          <strong>{{ item.name }}</strong>
          <p class="ag-muted">Prefix {{ item.invoicePrefix }}@if (item.code) { · {{ item.code }} }</p>
        </div>
        <div class="ag-inline">
          <agrivio-ui-status-badge [label]="item.status" [tone]="item.status === 'active' ? 'success' : 'neutral'" />
          @if (canManage()) {
            <a class="ag-btn ag-btn--secondary" [routerLink]="['/app/branches', item.id]">Edit</a>
          }
        </div>
      </article>
    }
  </div>
}
