<agrivio-ui-page-header
  [title]="warehouseId() ? 'Edit warehouse' : 'Create warehouse'"
  eyebrow="Locations"
  lede="Warehouses belong to the organization and can grow beyond the initial single warehouse."
/>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading warehouse…" />
} @else if (!canManage()) {
  <agrivio-ui-alert tone="warning" message="You do not have permission to manage warehouses." />
} @else {
  @if (errorMessage(); as error) {
    <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
  }
  <form
    class="ag-stack form ag-form ag-form--with-required-hint"
    [formGroup]="form"
    (ngSubmit)="save()"
    data-testid="warehouse-form"
  >
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Name"
        for="warehouse-name"
        [required]="fieldRequired(form.controls.name)"
      />
      <input
        id="warehouse-name"
        class="ag-input"
        formControlName="name"
        data-testid="warehouse-name"
        [attr.aria-required]="fieldRequired(form.controls.name) ? 'true' : null"
      />
    </div>
    <div class="ag-field">
      <agrivio-ui-field-label label="Code (optional)" for="warehouse-code" />
      <input id="warehouse-code" class="ag-input" formControlName="code" data-testid="warehouse-code" />
    </div>
    @if (warehouseId()) {
      <div class="ag-field">
        <agrivio-ui-field-label label="Status" for="warehouse-status" />
        <select id="warehouse-status" class="ag-select" formControlName="status" data-testid="warehouse-status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    }
    <div class="ag-inline">
      <button class="ag-btn" type="submit" [disabled]="saving()" data-testid="warehouse-save">Save</button>
      <a class="ag-btn ag-btn--secondary" routerLink="/app/warehouses">Cancel</a>
    </div>
  </form>
}
