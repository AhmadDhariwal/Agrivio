<agrivio-ui-page-header
  [title]="branchId() ? 'Edit branch' : 'Create branch'"
  eyebrow="Locations"
  lede="Invoice prefixes are owned by Locations and must stay unique within the organization."
/>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading branch…" />
} @else if (!canManage()) {
  <agrivio-ui-alert tone="warning" message="You do not have permission to manage branches." />
} @else {
  @if (errorMessage(); as error) {
    <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
  }
  <form
    class="ag-stack form ag-form ag-form--with-required-hint"
    [formGroup]="form"
    (ngSubmit)="save()"
    data-testid="branch-form"
  >
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Name"
        for="branch-name"
        [required]="fieldRequired(form.controls.name)"
      />
      <input
        id="branch-name"
        class="ag-input"
        formControlName="name"
        data-testid="branch-name"
        [attr.aria-required]="fieldRequired(form.controls.name) ? 'true' : null"
      />
    </div>
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Invoice prefix"
        for="branch-invoice-prefix"
        [required]="fieldRequired(form.controls.invoicePrefix)"
      />
      <input
        id="branch-invoice-prefix"
        class="ag-input"
        formControlName="invoicePrefix"
        data-testid="branch-invoice-prefix"
        [attr.aria-required]="fieldRequired(form.controls.invoicePrefix) ? 'true' : null"
      />
    </div>
    <div class="ag-field">
      <agrivio-ui-field-label label="Code (optional)" for="branch-code" />
      <input id="branch-code" class="ag-input" formControlName="code" data-testid="branch-code" />
    </div>
    @if (branchId()) {
      <div class="ag-field">
        <agrivio-ui-field-label label="Status" for="branch-status" />
        <select id="branch-status" class="ag-select" formControlName="status" data-testid="branch-status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    }
    <div class="ag-inline">
      <button class="ag-btn" type="submit" [disabled]="saving()" data-testid="branch-save">Save</button>
      <a class="ag-btn ag-btn--secondary" routerLink="/app/branches">Cancel</a>
    </div>
  </form>
}
