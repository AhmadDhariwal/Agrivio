<agrivio-ui-page-header
  title="Warehouses"
  eyebrow="Locations"
  lede="Organizations can start with one warehouse and add more within plan limits. Stock quantities are managed later in Inventory."
>
  @if (canManage()) {
    <a class="ag-btn" routerLink="/app/warehouses/new" data-testid="warehouse-create-link">Create warehouse</a>
  }
</agrivio-ui-page-header>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading warehouses…" />
} @else if (errorMessage(); as error) {
  <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
} @else if (items().length === 0) {
  <agrivio-ui-empty-state
    title="No warehouses yet"
    message="Create a warehouse to hold stock for this organization."
  />
} @else {
  <div class="ag-stack" data-testid="warehouses-list">
    @for (item of items(); track item.id) {
      <article class="row">
        <div>
          <strong>{{ item.name }}</strong>
          @if (item.code) {
            <p class="ag-muted">{{ item.code }}</p>
          }
        </div>
        <div class="ag-inline">
          <agrivio-ui-status-badge [label]="item.status" [tone]="item.status === 'active' ? 'success' : 'neutral'" />
          @if (canManage()) {
            <a class="ag-btn ag-btn--secondary" [routerLink]="['/app/warehouses', item.id]">Edit</a>
          }
        </div>
      </article>
    }
  </div>
}
