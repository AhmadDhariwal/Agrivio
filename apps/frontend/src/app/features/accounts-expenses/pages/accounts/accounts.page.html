<agrivio-ui-page-header
  title="Accounts"
  eyebrow="Cash & bank"
  lede="Manage cash, bank, and wallet accounts used for money movements."
>
  @if (canManage()) {
    <a class="ag-btn" routerLink="/app/accounts/new" data-testid="account-create-link">Create account</a>
  }
</agrivio-ui-page-header>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading accounts…" />
} @else if (errorMessage(); as error) {
  <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
} @else if (items().length === 0) {
  <agrivio-ui-empty-state
    title="No accounts yet"
    message="Create the first cash, bank, or wallet account."
  />
} @else {
  <div class="ag-stack" data-testid="accounts-list">
    @for (item of items(); track item.id) {
      <article class="row">
        <div>
          <strong>{{ item.name }}</strong>
          <p class="ag-muted">{{ item.accountType }}</p>
        </div>
        <div class="ag-inline">
          <agrivio-ui-status-badge [label]="item.status" [tone]="item.status === 'active' ? 'success' : 'neutral'" />
          @if (canManage()) {
            <a class="ag-btn ag-btn--secondary" [routerLink]="['/app/accounts', item.id]">Edit</a>
          }
        </div>
      </article>
    }
  </div>
}
