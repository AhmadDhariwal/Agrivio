<agrivio-ui-page-header
  [title]="categoryId() ? 'Edit expense category' : 'Create expense category'"
  eyebrow="Accounts"
  lede="Expense categories classify operating expenses."
/>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading category…" />
} @else if (!canPost()) {
  <agrivio-ui-alert tone="warning" message="You do not have permission to manage expense categories." />
} @else {
  @if (errorMessage(); as error) {
    <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
  }
  <form
    class="ag-stack form ag-form ag-form--with-required-hint"
    [formGroup]="form"
    (ngSubmit)="save()"
    data-testid="expense-category-form"
  >
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Name"
        for="expense-category-name"
        [required]="fieldRequired(form.controls.name)"
      />
      <input
        id="expense-category-name"
        class="ag-input"
        formControlName="name"
        data-testid="expense-category-name"
        [attr.aria-required]="fieldRequired(form.controls.name) ? 'true' : null"
      />
    </div>
    @if (categoryId()) {
      <div class="ag-field">
        <agrivio-ui-field-label label="Status" for="expense-category-status" />
        <select
          id="expense-category-status"
          class="ag-select"
          formControlName="status"
          data-testid="expense-category-status"
        >
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    }
    <div class="ag-inline">
      <button class="ag-btn" type="submit" [disabled]="saving()" data-testid="expense-category-save">Save</button>
      <a class="ag-btn ag-btn--secondary" routerLink="/app/expense-categories">Cancel</a>
    </div>
  </form>
}
