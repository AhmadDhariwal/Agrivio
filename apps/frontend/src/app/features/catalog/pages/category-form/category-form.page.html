<agrivio-ui-page-header
  [title]="categoryId() ? 'Edit category' : 'Create category'"
  eyebrow="Catalog"
  lede="Categories group products and constrain tracking rules by product class."
/>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading category…" />
} @else if (!canManage()) {
  <agrivio-ui-alert tone="warning" message="You do not have permission to manage categories." />
} @else {
  @if (errorMessage(); as error) {
    <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
  }
  <form
    class="ag-stack form ag-form ag-form--with-required-hint"
    [formGroup]="form"
    (ngSubmit)="save()"
    data-testid="category-form"
  >
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Name"
        for="category-name"
        [required]="fieldRequired(form.controls.name)"
      />
      <input
        id="category-name"
        class="ag-input"
        formControlName="name"
        data-testid="category-name"
        [attr.aria-required]="fieldRequired(form.controls.name) ? 'true' : null"
      />
    </div>
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Product class"
        for="category-product-class"
        [required]="fieldRequired(form.controls.productClass)"
      />
      <select
        id="category-product-class"
        class="ag-select"
        formControlName="productClass"
        data-testid="category-product-class"
        [attr.aria-required]="fieldRequired(form.controls.productClass) ? 'true' : null"
      >
        <option value="general">General</option>
        <option value="fertilizer">Fertilizer</option>
        <option value="seed">Seed</option>
        <option value="pesticide">Pesticide</option>
        <option value="chemical">Chemical</option>
      </select>
    </div>
    @if (categoryId()) {
      <div class="ag-field">
        <agrivio-ui-field-label label="Status" for="category-status" />
        <select id="category-status" class="ag-select" formControlName="status" data-testid="category-status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    }
    <div class="ag-inline">
      <button class="ag-btn" type="submit" [disabled]="saving()" data-testid="category-save">Save</button>
      <a class="ag-btn ag-btn--secondary" routerLink="/app/categories">Cancel</a>
    </div>
  </form>
}
