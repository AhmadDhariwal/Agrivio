<agrivio-ui-page-header
  [title]="'Pricing · ' + productName()"
  eyebrow="Catalog"
  lede="Set retail, wholesale, dealer, and distributor prices for this product."
/>

@if (loading()) {
  <agrivio-ui-loading-state label="Loading pricing…" />
} @else if (!canManage()) {
  <agrivio-ui-alert tone="warning" message="You do not have permission to manage product pricing." />
} @else {
  @if (errorMessage(); as error) {
    <agrivio-ui-alert tone="danger" [message]="error" role="alert" />
  }
  <form
    class="ag-stack form ag-form ag-form--with-required-hint"
    [formGroup]="form"
    (ngSubmit)="save()"
    data-testid="product-pricing"
  >
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Retail"
        for="price-retail"
        [required]="fieldRequired(form.controls.retail)"
      />
      <input
        id="price-retail"
        class="ag-input"
        formControlName="retail"
        data-testid="price-retail"
        [attr.aria-required]="fieldRequired(form.controls.retail) ? 'true' : null"
      />
    </div>
    <div class="ag-field">
      <agrivio-ui-field-label label="Wholesale" for="price-wholesale" />
      <input id="price-wholesale" class="ag-input" formControlName="wholesale" data-testid="price-wholesale" />
    </div>
    <div class="ag-field">
      <agrivio-ui-field-label label="Dealer" for="price-dealer" />
      <input id="price-dealer" class="ag-input" formControlName="dealer" data-testid="price-dealer" />
    </div>
    <div class="ag-field">
      <agrivio-ui-field-label label="Distributor" for="price-distributor" />
      <input id="price-distributor" class="ag-input" formControlName="distributor" data-testid="price-distributor" />
    </div>
    <div class="ag-inline">
      <button class="ag-btn" type="submit" [disabled]="saving()" data-testid="product-pricing-save">
        Save
      </button>
      <a class="ag-btn ag-btn--secondary" routerLink="/app/products">Cancel</a>
    </div>
  </form>
}
