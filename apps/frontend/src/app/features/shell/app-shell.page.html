<section class="shell">
  <header class="chrome">
    <div>
      <p class="brand">Agrivio</p>
      <p class="context" data-testid="active-context">{{ contextLabel() }}</p>
    </div>
    <nav>
      <a routerLink="/app">Workspace</a>
      <a routerLink="/context">Switch context</a>
      @if (canSubmitBilling()) {
        <a routerLink="/app/subscription/billing">Billing</a>
      }
      @if (canManagePlatformOrgs()) {
        <a routerLink="/app/platform/organizations">Organizations</a>
      }
      @if (canManagePlans()) {
        <a routerLink="/app/platform/plans">Plans</a>
      }
      @if (canReviewBilling()) {
        <a routerLink="/app/platform/billing-review">Billing review</a>
      }
      <button type="button" data-testid="sign-out" [disabled]="signingOut()" (click)="signOut()">
        Sign out
      </button>
    </nav>
  </header>

  <agrivio-subscription-status-banner [accessState]="subscriptionAccessState()" />

  @if (errorMessage(); as error) {
    <p class="error" role="alert">{{ error }}</p>
  }

  <router-outlet></router-outlet>
</section>
