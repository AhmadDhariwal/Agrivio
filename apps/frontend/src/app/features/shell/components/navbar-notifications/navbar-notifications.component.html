@if (canViewAlerts()) {
  <div class="ag-notification-wrapper">
    <!-- Bell Trigger Button -->
    <button
      type="button"
      class="ag-notification-trigger"
      (click)="togglePanel()"
      [attr.aria-expanded]="isOpen()"
      aria-haspopup="true"
      aria-label="Notifications"
      data-testid="navbar-notification-bell"
    >
      <svg
        class="ag-notification-bell-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>

      @if (hasUnread()) {
        <span
          class="ag-notification-badge"
          data-testid="navbar-unread-badge"
          [attr.aria-label]="unreadCount() + ' unread notifications'"
        >
          {{ unreadCount() > 99 ? '99+' : unreadCount() }}
        </span>
      }
    </button>

    <!-- Notification Dropdown Panel -->
    @if (isOpen()) {
      <div
        class="ag-notification-panel"
        role="region"
        aria-label="Notifications overview"
        data-testid="navbar-notification-panel"
      >
        <!-- Panel Header -->
        <div class="ag-notification-panel__header">
          <div class="ag-notification-panel__title-group">
            <span class="ag-notification-panel__title">Notifications</span>
          </div>

          @if (hasUnread() && canPerformMarkAllRead()) {
            <button
              type="button"
              class="ag-notification-panel__mark-read"
              (click)="markAllAsRead()"
              data-testid="navbar-mark-all-read"
            >
              Mark all as read
            </button>
          }
        </div>

        <!-- Panel Body -->
        <div class="ag-notification-panel__body">
          @if (loading()) {
            <div class="ag-notification-panel__loading">
              <span class="ag-notification-panel__spinner"></span>
              <span>Loading notifications…</span>
            </div>
          } @else {
            <div class="ag-notification-panel__list" role="list">
              @for (item of feed(); track item.id) {
                <button
                  type="button"
                  class="ag-notification-item"
                  [class.is-unread]="!item.isRead"
                  (click)="onNotificationClick(item)"
                  [attr.data-testid]="'notification-item-' + item.alertType"
                >
                  <!-- Icon box -->
                  <div
                    class="ag-notification-item__icon-box"
                    [class.ag-notification-item__icon-box--green]="item.alertType === 'upcoming_expiry'"
                    [class.ag-notification-item__icon-box--red]="item.alertType === 'expired_stock'"
                    [class.ag-notification-item__icon-box--amber]="item.alertType === 'low_stock' || item.alertType === 'dead_stock'"
                    [class.ag-notification-item__icon-box--blue]="item.alertType === 'customer_dues'"
                    [class.ag-notification-item__icon-box--orange]="item.alertType === 'supplier_dues'"
                    aria-hidden="true"
                  >
                    @if (item.alertType === 'upcoming_expiry') {
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                      </svg>
                    } @else if (item.alertType === 'expired_stock') {
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <line x1="10" y1="14" x2="14" y2="18"></line>
                        <line x1="14" y1="14" x2="10" y2="18"></line>
                      </svg>
                    } @else if (item.alertType === 'customer_dues') {
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                      </svg>
                    } @else if (item.alertType === 'supplier_dues') {
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                      </svg>
                    } @else {
                      <!-- Low stock / Dead stock alert -->
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                      </svg>
                    }
                  </div>

                  <!-- Content column -->
                  <div class="ag-notification-item__content">
                    <div class="ag-notification-item__top-row">
                      <span class="ag-notification-item__title">{{ item.title }}</span>
                      <div class="ag-notification-item__meta">
                        @if (item.createdAt) {
                          <span class="ag-notification-item__time">{{ formatRelativeTime(item.createdAt) }}</span>
                        }
                        @if (!item.isRead) {
                          <span class="ag-notification-item__dot" aria-label="Unread"></span>
                        }
                      </div>
                    </div>
                    <p class="ag-notification-item__body">{{ item.body }}</p>
                  </div>
                </button>
              } @empty {
                <div class="ag-notification-panel__empty" data-testid="navbar-notifications-empty">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                  </svg>
                  <p>No active notifications.</p>
                </div>
              }
            </div>
          }
        </div>

        <!-- Panel Footer -->
        <div class="ag-notification-panel__footer">
          <button
            type="button"
            class="ag-notification-panel__view-all"
            (click)="viewAll()"
            data-testid="navbar-view-all-alerts"
          >
            View all
          </button>
        </div>
      </div>
    }
  </div>
}
