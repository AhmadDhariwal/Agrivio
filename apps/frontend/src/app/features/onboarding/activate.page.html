<section class="onboarding">
  <h1>Activate owner account</h1>
  <p>Set your initial password using the one-time activation token.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Activation token
      <input formControlName="token" autocomplete="one-time-code" />
    </label>
    <label>
      Password
      <input formControlName="password" type="password" autocomplete="new-password" />
    </label>

    @if (errorMessage(); as error) {
      <p class="error" role="alert">{{ error }}</p>
    }
    @if (successMessage(); as success) {
      <p class="success" role="status">{{ success }}</p>
    }

    <button type="submit" [disabled]="submitting()">Activate</button>
  </form>
</section>
