<section class="auth-page">
  <h1>Agrivio</h1>
  <p>Sign in to your organization workspace.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" data-testid="login-email" />
    </label>
    <label>
      Password
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        data-testid="login-password"
      />
    </label>
    <button type="submit" [disabled]="submitting()" data-testid="login-submit">Sign in</button>
  </form>

  @if (successMessage(); as message) {
    <p class="success">{{ message }}</p>
  }
  @if (errorMessage(); as message) {
    <p class="error">{{ message }}</p>
  }

  <p>
    <a routerLink="/password-reset">Forgot password?</a>
    ·
    <a routerLink="/request-access">Request access</a>
    ·
    <a routerLink="/">Landing</a>
  </p>
</section>
