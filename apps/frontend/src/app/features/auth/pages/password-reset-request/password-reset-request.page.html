<agrivio-auth-layout
  title="Reset password"
  subtitle="Enter your email. If an account exists, we will send a reset link. We will not say whether the email is registered."
>
  <form class="ag-form ag-form--with-required-hint" [formGroup]="form" (ngSubmit)="submit()">
    <div class="ag-field">
      <agrivio-ui-field-label
        label="Email"
        for="reset-email"
        [required]="fieldRequired(form.controls.email)"
      />
      <input
        id="reset-email"
        class="ag-input"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-required]="fieldRequired(form.controls.email) ? 'true' : null"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="ag-field__error">Enter a valid email address.</p>
      }
    </div>
    <button type="submit" class="ag-btn ag-btn--primary" [disabled]="submitting() || form.invalid">
      {{ submitting() ? 'Sending…' : 'Send reset request' }}
    </button>
  </form>

  @if (successMessage(); as message) {
    <agrivio-ui-alert style="display: block; margin-top: 1rem" [message]="message" tone="success" />
  }
  @if (errorMessage(); as message) {
    <agrivio-ui-alert
      style="display: block; margin-top: 1rem"
      [message]="message"
      tone="danger"
      role="alert"
    />
  }

  <div class="ag-auth-links">
    <a routerLink="/password-reset/confirm">I already have a token</a>
    <a routerLink="/login">Back to sign in</a>
  </div>
</agrivio-auth-layout>
