name: Integration

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: MongoDB replica-set integration and transaction smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Verify toolchain pins
        run: |
          node --version | grep -F 'v24.18.0'
          npm --version | grep -F '11.16.0'

      - name: Start MongoDB 8.2.12 replica-set topology
        run: npm run db:up

      - name: Initialize replica set rs0 and wait for PRIMARY
        run: npm run db:init

      - name: Prove replica-set status
        run: npm run db:status

      - name: Integration and transaction smoke tests
        run: npm run test:integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_REPLICA_SET: rs0

      - name: Stop MongoDB Compose stack
        if: always()
        run: npm run db:down
