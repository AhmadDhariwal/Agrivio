name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit, architecture, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Verify toolchain pins
        run: |
          node --version | grep -F 'v24.18.0'
          npm --version | grep -F '11.16.0'

      # format:check omitted intentionally: Windows working trees may carry CRLF drift on
      # untouched files (core.autocrlf). Correctness gates below are not weakened.

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Architecture-boundary tests
        run: npm run test:architecture

      - name: Build
        run: npm run build
