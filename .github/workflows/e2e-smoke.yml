name: E2E Smoke

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: e2e-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: Chromium Playwright empty-app smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain pins
        run: |
          node --version | grep -F 'v24.18.0'
          pnpm --version | grep -F '11.17.0'

      - name: Start MongoDB 8.2.12 replica-set topology
        run: pnpm db:up

      - name: Initialize replica set rs0 and wait for PRIMARY
        run: pnpm db:init

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Chromium E2E smoke
        run: pnpm e2e
        env:
          CI: true
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_REPLICA_SET: rs0

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop MongoDB Compose stack
        if: always()
        run: pnpm db:down
